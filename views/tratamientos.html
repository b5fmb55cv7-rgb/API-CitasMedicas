<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tratamientos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>🩺 Gestión de Tratamientos</h2>

<form id="formTratamiento">

<div class="row">

<div class="col-md-5">
<input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
</div>

<div class="col-md-5">
<input type="text" id="descripcion" class="form-control" placeholder="Descripción" required>
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">Guardar</button>
</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead class="table-primary">

<tr>
<th>ID</th>
<th>Nombre</th>
<th>Descripción</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tablaTratamientos"></tbody>

</table>

</div>

<script src="/js/tratamientos.js"></script>

</body>
</html>
