<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Usuarios</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">

<i class="fa-solid fa-users"></i>

Usuarios

</h2>

<div class="card">

<div class="card-body">

<form id="formUsuario">

<input type="hidden" id="id">

<div class="row">

<div class="col-md-3">

<input
type="text"
id="nombre"
class="form-control"
placeholder="Nombre"
required>

</div>

<div class="col-md-3">

<input
type="email"
id="correo"
class="form-control"
placeholder="Correo"
required>

</div>

<div class="col-md-3">

<input
type="password"
id="password"
class="form-control"
placeholder="Contraseña"
required>

</div>

<div class="col-md-2">

<select
id="rol"
class="form-select">

<option>Administrador</option>

<option>Recepcionista</option>

<option>Médico</option>

</select>

</div>

<div class="col-md-1">

<button
class="btn btn-primary w-100">

Guardar

</button>

</div>

</div>

</form>

<hr>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Nombre</th>

<th>Correo</th>

<th>Rol</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaUsuarios">

</tbody>

</table>

</div>

</div>

</div>

<script src="/js/usuarios.js"></script>

</body>
</html>
