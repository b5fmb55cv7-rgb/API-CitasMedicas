<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultorios</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

<h2>🏥 Gestión de Consultorios</h2>

<div class="card mt-3">

<div class="card-body">

<form id="formConsultorio">

<input type="hidden" id="id">

<div class="row">

<div class="col-md-5">
<input class="form-control" id="nombre" placeholder="Nombre del consultorio" required>
</div>

<div class="col-md-5">
<input class="form-control" id="ubicacion" placeholder="Ubicación" required>
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">Guardar</button>
</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Nombre</th>
<th>Ubicación</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaConsultorios"></tbody>

</table>

</div>

</div>

</div>

<script src="/js/consultorios.js"></script>

</body>
</html>
