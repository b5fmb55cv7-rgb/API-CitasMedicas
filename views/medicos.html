<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Médicos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>👨‍⚕️ Gestión de Médicos</h2>

<div class="card mt-3">

<div class="card-body">

<form id="formMedico">

<input type="hidden" id="id">

<div class="row">

<div class="col-md-3">
<input class="form-control" id="nombre" placeholder="Nombre" required>
</div>

<div class="col-md-3">
<input class="form-control" id="especialidad" placeholder="Especialidad" required>
</div>

<div class="col-md-3">
<input class="form-control" id="telefono" placeholder="Teléfono" required>
</div>

<div class="col-md-2">
<input class="form-control" id="correo" placeholder="Correo" required>
</div>

<div class="col-md-1">
<button class="btn btn-success w-100">Guardar</button>
</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Nombre</th>
<th>Especialidad</th>
<th>Teléfono</th>
<th>Correo</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaMedicos"></tbody>

</table>

</div>

</div>

</div>

<script src="/js/medicos.js"></script>

</body>

</html>
